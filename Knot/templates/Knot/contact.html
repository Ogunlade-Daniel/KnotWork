<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Knotwork</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #eef3fb; color: #102a43; }
        .page { max-width: 960px; margin: 0 auto; padding: 32px; }
        .card { background: white; border-radius: 18px; padding: 28px; box-shadow: 0 18px 40px rgba(16, 42, 67, 0.08); }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input, textarea { width: 100%; border: 1px solid #c7d2fe; border-radius: 12px; padding: 12px; font: inherit; }
        button { margin-top: 22px; border: none; border-radius: 12px; background: #2f4f9d; color: white; padding: 14px 24px; cursor: pointer; }
        button:hover { opacity: .95; }
        .flash { margin-bottom: 24px; padding: 16px; border-radius: 14px; background: #d9f7ff; color: #034c7d; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>Contact us</h1>
        <p>Have questions, feedback, or partnership ideas? Send us a message and we’ll respond as soon as possible.</p>
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post" novalidate>
            {% csrf_token %}
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <button type="submit">Send message</button>
        </form>
    </div>
</div>
</body>
</html>
