<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to Knotwork</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f7fbff; color: #0f172a; }
        .page { max-width: 960px; margin: 0 auto; padding: 32px; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08); }
        label { display: block; margin: 18px 0 7px; font-weight: 700; }
        input, textarea { width: 100%; border: 1px solid #cbd5e1; border-radius: 14px; padding: 12px; font: inherit; }
        button { margin-top: 20px; border: none; border-radius: 14px; background: #2563eb; color: white; padding: 14px 24px; cursor: pointer; }
        button:hover { opacity: 0.95; }
        .flash { margin-bottom: 24px; padding: 16px; border-radius: 14px; background: #dbeafe; color: #1e3a8a; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>Support Knotwork</h1>
        <p>Your donation helps keep live learning open, secure, and available to learners around the world.</p>
        {% if messages %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post" novalidate>
            {% csrf_token %}
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="amount">Donation amount (USD)</label>
            <input id="amount" name="amount" type="number" step="0.01" min="1" required>

            <label for="message">Message (optional)</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Donate now</button>
        </form>
    </div>
</div>
</body>
</html>
